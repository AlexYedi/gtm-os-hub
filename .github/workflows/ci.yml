name: ci

# The PII egress guard is enforced, not aspirational: the safety tests must pass
# before any change merges or lands on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  egress-safety:
    name: PII egress guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Dependency-light: public-safety has no imports, so no install needed.
      - name: Run PII egress guard tests
        run: bun test lib/public-safety.test.ts

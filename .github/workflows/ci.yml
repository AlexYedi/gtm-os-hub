name: ci

# The PII egress guard is enforced, not aspirational: the safety tests must pass
# before any change merges or lands on main. Covers both the GitHub adapter
# (public-safety) and the learning/university adapter (lib/sources/learning).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  egress-safety:
    name: PII egress guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install deps (learning adapter imports @supabase/supabase-js)
        run: bun install --frozen-lockfile
      - name: Run PII egress guard tests
        run: bun test lib/
